name: VVVUSDT Weekly Walk-Forward Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * 0"

permissions:
  contents: read

concurrency:
  group: vvvusdt-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile mexc_data.py smc_analysis.py trade_plan.py signal_journal.py walk_forward_backtest.py

      - name: Run no-lookahead walk-forward backtest
        run: |
          python walk_forward_backtest.py

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: VVVUSDT-Walk-Forward-Backtest
          path: output/VVVUSDT_walk_forward_backtest.json
          retention-days: 90
