name: VVV Hourly Delivery Watchdog

on:
  workflow_dispatch:
  schedule:
    # Staggered independently from the main worker.
    - cron: "12,22,32,42,52 * * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  actions: write

concurrency:
  group: vvv-delivery-watchdog
  cancel-in-progress: true

jobs:
  check-delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check current local hourly slot
        id: health
        shell: bash
        run: |
          python - <<'PY' | tee /tmp/vvv-watchdog.txt
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          state_path = Path("telegram_state.json")
          current_slot = datetime.now(
              ZoneInfo("Asia/Ho_Chi_Minh")
          ).strftime("%Y-%m-%dT%H")

          last_auto_slot = None
          last_sent = None
          last_event = None

          try:
              data = json.loads(
                  state_path.read_text(
                      encoding="utf-8"
                  )
              )
              last_auto_slot = data.get(
                  "last_auto_slot"
              )
              last_sent = data.get(
                  "last_sent_utc"
              )
              last_event = data.get(
                  "last_event"
              )
          except Exception as exc:
              print(f"reason=state_error:{exc}")

          missing = (
              last_auto_slot
              != current_slot
          )

          print(
              f"missing={'true' if missing else 'false'}"
          )
          print(
              f"current_slot={current_slot}"
          )
          print(
              f"last_auto_slot={last_auto_slot or 'none'}"
          )
          print(
              f"last_sent_utc={last_sent or 'none'}"
          )
          print(
              f"last_event={last_event or 'none'}"
          )
          PY

          MISSING=$(grep '^missing=' /tmp/vvv-watchdog.txt | tail -1 | cut -d= -f2)
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Recover missing hourly delivery
        if: steps.health.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Automatic VVV delivery is missing for the current local hour."
          gh workflow run vvv-hourly.yml --ref main -f source=watchdog

      - name: Healthy
        if: steps.health.outputs.missing != 'true'
        run: |
          echo "Automatic VVV delivery already completed for the current local hour."
