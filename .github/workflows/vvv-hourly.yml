name: VVVUSDT Hourly MEXC SMC

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: vvvusdt-hourly
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Analyze MEXC SMC and create charts
        run: |
          python main.py

      - name: Upload charts, report and hourly update
        uses: actions/upload-artifact@v4
        with:
          name: VVVUSDT-MEXC-SMC
          path: output/
          retention-days: 30

      - name: Persist state for next hourly run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update VVV hourly state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
