name: VVVUSDT Hourly MEXC SMC

on:
  workflow_dispatch:
  # GitHub documents that scheduled jobs near the start of the hour
  # can be delayed or dropped under load. Run at minute 23 instead.
  schedule:
    - cron: "23 * * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

concurrency:
  group: vvvusdt-hourly
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile main.py mexc_data.py smc_analysis.py trade_plan.py chart.py ai_analysis.py telegram_notify.py signal_journal.py self_check.py walk_forward_backtest.py

      - name: Analyze MEXC SMC and create charts
        run: |
          python main.py

      - name: Validate deterministic invariants
        run: |
          python self_check.py

      - name: AI Price Action review via OpenRouter
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: qwen/qwen3.8-27b:free
          OPENROUTER_FALLBACK_MODEL: openrouter/free
        run: |
          python ai_analysis.py

      - name: Upload charts, report and hourly update
        uses: actions/upload-artifact@v4
        with:
          name: VVVUSDT-MEXC-SMC
          path: output/
          retention-days: 30

      - name: Send Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_notify.py

      - name: Persist state for next hourly run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json signal_history.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update VVV hourly state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
